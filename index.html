<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>App Redirect</title>

  <script>
    window.onload = function () {
      var ua = navigator.userAgent || navigator.vendor || window.opera;

      // ANDROID → GOOGLE PLAY STORE
      if (/android/i.test(ua)) {
        window.location.href =
          "intent://details?id=com.merofe3601.OUTDO#Intent;scheme=market;package=com.android.vending;end;";
        return;
      }

      // iOS → APP STORE
      if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
        window.location.href =
          "https://apps.apple.com/in/app/angel-battery/id6746981292";
        return;
      }
    };
  </script>
</head>

<body>
  <p style="text-align:center;font-size:18px;">
    Redirecting to the store…
  </p>
</body>
</html>
